<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FFB6C1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="甜心小厨">
  <meta name="description" content="我的私人菜谱手账">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <title>甜心小厨 · 我的菜谱手账</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 背景纹理 -->
<div class="paper-bg" aria-hidden="true">
  <span class="doodle doodle-1">✿</span>
  <span class="doodle doodle-2">♡</span>
  <span class="doodle doodle-3">✿</span>
  <span class="doodle doodle-4">♡</span>
</div>

<!-- ============ 密码锁屏 ============ -->
<div class="lock-screen" id="lockScreen">
  <div class="lock-card">
    <div class="lock-logo">
      <svg viewBox="0 0 100 100" width="88" height="88" aria-hidden="true">
        <path d="M22 44 Q22 22 50 22 Q78 22 78 44" fill="none" stroke="#E58FA0" stroke-width="6" stroke-linecap="round"/>
        <rect x="18" y="42" width="64" height="46" rx="12" fill="#FFC9D4" stroke="#E58FA0" stroke-width="3"/>
        <circle cx="50" cy="60" r="7" fill="#FFF" stroke="#E58FA0" stroke-width="2.5"/>
        <path d="M50 66 L50 73" stroke="#E58FA0" stroke-width="3" stroke-linecap="round"/>
        <path d="M30 34 Q26 24 34 22" fill="none" stroke="#A8D8C0" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>甜心小厨</h1>
    <p class="lock-sub">MY LITTLE RECIPE BOOK</p>
    <div class="lock-hearts">♡ ♥ ♡</div>
    <label class="lock-label">输入密码，翻开我的小厨</label>
    <div class="pin-dots" id="pinDots">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="pin-pad" id="pinPad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button class="pk-fn" data-k="clear">清空</button><button data-k="0">0</button><button class="pk-fn" data-k="del">⌫</button>
    </div>
    <p class="lock-error" id="lockError">密码不对哦，再试试～</p>
    <p class="lock-hint">🔒 只属于我的私密菜谱</p>
  </div>
</div>

<!-- ============ 主应用 ============ -->
<div class="app" id="app" style="display:none">

  <!-- 顶部栏 -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-badge">♥</div>
      <div class="brand-text"><strong>甜心小厨</strong><span id="recipeCount">我的菜谱手账</span></div>
    </div>
    <div class="top-actions">
      <button class="round-btn" id="lockBtn" title="锁定">🔒</button>
    </div>
  </header>

  <!-- 视图：列表 -->
  <main class="view active" id="viewList">
    <!-- 搜索 -->
    <div class="search-wrap">
      <span class="search-ico">🔍</span>
      <input type="text" id="searchInput" placeholder="搜菜名、食材、标签…" autocomplete="off">
      <button class="search-clear" id="searchClear" style="display:none">✕</button>
    </div>

    <!-- 快捷筛选 -->
    <div class="quick-filter">
      <button class="fchip active" data-filter="all">全部</button>
      <button class="fchip" data-filter="fav">♥ 收藏</button>
      <span class="qf-spacer"></span>
      <button class="filter-toggle" id="filterToggle">⚗ 筛选 <span id="filterBadge"></span></button>
    </div>

    <!-- 展开的分类筛选面板 -->
    <div class="filter-panel" id="filterPanel">
      <div class="filter-dim-tabs" id="filterDimTabs"></div>
      <div class="filter-options" id="filterOptions"></div>
    </div>

    <!-- 菜谱网格 -->
    <div class="recipe-grid" id="recipeGrid"></div>

    <!-- 空状态 -->
    <div class="empty-state" id="emptyState" style="display:none">
      <div class="empty-ill">🍰</div>
      <h3 id="emptyTitle">还没有菜谱呢</h3>
      <p id="emptyDesc">点右下角的 ＋ 添加第一道美味吧</p>
      <button class="btn-primary" id="emptyAdd">＋ 添加菜谱</button>
    </div>
  </main>

  <!-- 视图：分类管理 -->
  <main class="view" id="viewManage">
    <div class="subhead">
      <button class="back-btn" data-back="list">‹ 返回</button>
      <h2>分类与标签管理</h2>
      <span class="head-spacer"></span>
    </div>
    <p class="manage-tip">自定义你的分类和标签，添加菜谱时就能选啦～</p>
    <div class="manage-groups" id="manageGroups"></div>
  </main>

  <!-- 视图：详情 -->
  <main class="view" id="viewDetail">
    <div class="detail-hero" id="detailHero"></div>
    <div class="detail-body" id="detailBody"></div>
  </main>

  <!-- 视图：编辑/新增 -->
  <main class="view" id="viewEdit">
    <div class="subhead edit-head">
      <button class="back-btn" id="editCancel">取消</button>
      <h2 id="editTitle">新增菜谱</h2>
      <button class="save-btn" id="editSave">保存</button>
    </div>
    <form class="edit-form" id="editForm">

      <div class="form-card">
        <div class="form-card-title"><span>①</span> 菜品封面</div>
        <div class="cover-upload" id="coverUpload">
          <input type="file" id="coverInput" accept="image/*" hidden>
          <div class="cover-placeholder" id="coverPlaceholder">
            <span class="cam-ico">📷</span>
            <p>点击上传菜品美照</p>
            <small>支持 JPG / PNG，自动压缩</small>
          </div>
          <img id="coverPreview" style="display:none" alt="封面预览">
          <button type="button" class="cover-change" id="coverChange" style="display:none">更换照片</button>
        </div>
      </div>

      <div class="form-card">
        <div class="form-card-title"><span>②</span> 基本信息</div>
        <label class="field"><span>菜品名称 <b>*</b></span>
          <input type="text" id="fName" placeholder="例如：草莓奶油蛋糕" required maxlength="40">
        </label>
        <div class="field-row">
          <label class="field"><span>烹饪时间（分钟）</span>
            <input type="number" id="fTime" placeholder="30" min="0" max="1440">
          </label>
          <label class="field"><span>份量</span>
            <input type="text" id="fServing" placeholder="2人份" maxlength="20">
          </label>
        </div>
        <label class="field"><span>所需厨具</span>
          <input type="text" id="fTools" placeholder="烤箱、打蛋器（用顿号分隔）" maxlength="120">
        </label>
      </div>

      <div class="form-card">
        <div class="form-card-title"><span>③</span> 食材清单</div>
        <div class="ingredient-list" id="ingredientList"></div>
        <button type="button" class="add-line-btn" id="addIngredient">＋ 添加食材</button>
      </div>

      <div class="form-card">
        <div class="form-card-title"><span>④</span> 烹饪步骤</div>
        <div class="step-list" id="stepList"></div>
        <button type="button" class="add-line-btn" id="addStep">＋ 添加步骤</button>
      </div>

      <div class="form-card">
        <div class="form-card-title"><span>⑤</span> 分类与标签</div>
        <div class="select-groups" id="selectGroups"></div>
        <label class="field"><span>自定义标签</span>
          <input type="text" id="fTags" placeholder="逗号分隔，例如：快手,低脂">
        </label>
        <label class="field"><span>小贴士 / 备注</span>
          <textarea id="fNote" rows="3" placeholder="记录你的独家心得…"></textarea>
        </label>
      </div>

      <div class="form-tail"></div>
    </form>
  </main>

  <!-- 底部导航 -->
  <nav class="bottom-nav">
    <button class="nav-item active" id="navList"><span>📖</span>菜谱</button>
    <button class="nav-item" id="navManage"><span>🏷️</span>分类</button>
    <button class="nav-add" id="navAdd"><span>＋</span></button>
    <button class="nav-item" id="navFav"><span>♥</span>收藏</button>
    <button class="nav-item" id="navLock"><span>🔒</span>锁定</button>
  </nav>
</div>

<!-- 图片查看 -->
<div class="modal" id="imgModal">
  <button class="modal-close" id="imgModalClose">✕</button>
  <img id="imgModalSrc" src="" alt="菜品图片">
</div>

<!-- 确认删除 -->
<div class="modal confirm-modal" id="confirmModal">
  <div class="confirm-box">
    <div class="confirm-emoji">🥺</div>
    <h3 id="confirmTitle">确定删除这道菜谱吗？</h3>
    <p id="confirmDesc">删除后就无法找回咯～</p>
    <div class="confirm-actions">
      <button class="btn-ghost" id="confirmNo">再想想</button>
      <button class="btn-danger" id="confirmYes">确定删除</button>
    </div>
  </div>
</div>

<!-- 添加分类弹窗 -->
<div class="modal confirm-modal" id="catModal">
  <div class="confirm-box">
    <h3 id="catModalTitle">添加分类</h3>
    <label class="field"><span>名称</span><input type="text" id="catNameInput" placeholder="输入名称" maxlength="16"></label>
    <div class="confirm-actions">
      <button class="btn-ghost" id="catModalNo">取消</button>
      <button class="btn-primary" id="catModalYes">添加</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
